controller:
  admin:
    username: admin
    password: admin123

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: '500m'
      memory: '1Gi'
    requests:
      cpu: '250m'
      memory: '512Mi'

  persistentVolume:
    enabled: true
    storageClass: 'ebs-sc'
    size: 10Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  serviceAccount:
    name: jenkins-sa
    create: false

  # Додаємо extraSecrets всередині controller
  extraSecrets:
    - name: jenkins-github-creds

  JCasC:
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:   # ← Використовуйте usernamePassword, а не string
                      scope: GLOBAL
                      id: "github-token"
                      username: ${jenkins_github_creds_username}
                      password: ${jenkins_github_creds_password}
                      description: "GitHub token from K8s secret"
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('https://github.com/YNazymko12/devops-hw.git')
                      credentials('github-token')
                    }
                    branches('*/lesson-8-9')
                  }
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("https://github.com/YNazymko12/devops-hw.git")
                                  credentials("github-token")
                                }
                                branches("*/lesson-8-9")
                              }
                            }
                          }
                        }
                      }
                    ''')
                  }
                }
              }
